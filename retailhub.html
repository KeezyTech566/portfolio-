<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retail Inventory & Sales Intelligence Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="background: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 2rem;">
  
  <div style="max-width: 1200px; margin: 0 auto;">
    <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 1rem; margin-bottom: 2rem;">
      <div>
        <h1 style="font-size: 1.75rem; margin: 0 0 0.25rem 0; color: #38bdf8;">Retail Inventory & Sales Engine</h1>
        <p style="color: #94a3b8; font-size: 0.9rem; margin: 0;">Multi-store stock monitoring, demand forecasting, and category performance metrics.</p>
      </div>
      <a href="index.html" style="background: #1e293b; color: #f8fafc; text-decoration: none; padding: 0.6rem 1.25rem; border-radius: 6px; font-size: 0.85rem; border: 1px solid #334155;">← Back to Hub</a>
    </header>

    <!-- KPI Summary Grid -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
      <div style="background: #0f172a; border: 1px solid #1e293b; padding: 1.5rem; border-radius: 8px;">
        <span style="color: #94a3b8; font-size: 0.8rem; display: block; margin-bottom: 0.4rem;">Total Active SKUs</span>
        <strong style="font-size: 1.8rem; color: #38bdf8;">4,280</strong>
      </div>
      <div style="background: #0f172a; border: 1px solid #1e293b; padding: 1.5rem; border-radius: 8px;">
        <span style="color: #94a3b8; font-size: 0.8rem; display: block; margin-bottom: 0.4rem;">Stockout Risk Rate</span>
        <strong style="font-size: 1.8rem; color: #34d399;">1.2%</strong>
      </div>
      <div style="background: #0f172a; border: 1px solid #1e293b; padding: 1.5rem; border-radius: 8px;">
        <span style="color: #94a3b8; font-size: 0.8rem; display: block; margin-bottom: 0.4rem;">Monthly Gross Margin</span>
        <strong style="font-size: 1.8rem; color: #818cf8;">34.5%</strong>
      </div>
    </div>

    <!-- Charts Section -->
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem;">
      <div style="background: #0f172a; border: 1px solid #1e293b; padding: 1.5rem; border-radius: 8px; height: 350px;">
        <h3 style="font-size: 1rem; color: #f8fafc; margin-bottom: 1rem;">Sales Trajectory vs Forecast (₦M)</h3>
        <canvas id="salesForecastChart"></canvas>
      </div>
      <div style="background: #0f172a; border: 1px solid #1e293b; padding: 1.5rem; border-radius: 8px; height: 350px;">
        <h3 style="font-size: 1rem; color: #f8fafc; margin-bottom: 1rem;">Inventory Health Share</h3>
        <canvas id="inventoryHealthChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const ctxSales = document.getElementById('salesForecastChart').getContext('2d');
    new Chart(ctxSales, {
      type: 'line',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'],
        datasets: [{
          label: 'Actual Sales',
          data: [42, 48, 51, 58, 65, 72, 80],
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56, 189, 248, 0.1)',
          tension: 0.3,
          fill: true
        }, {
          label: 'AI Forecast',
          data: [null, null, null, null, 65, 75, 88],
          borderColor: '#818cf8',
          borderDash: [5, 5],
          tension: 0.3
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }, x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } } }, plugins: { legend: { labels: { color: '#94a3b8' } } } }
    });

    const ctxHealth = document.getElementById('inventoryHealthChart').getContext('2d');
    new Chart(ctxHealth, {
      type: 'doughnut',
      data: {
        labels: ['Optimal Stock', 'Overstock', 'Low Stock'],
        datasets: [{
          data: [78, 16, 6],
          backgroundColor: ['#34d399', '#818cf8', '#f43f5e']
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8' } } } }
    });
  </script>
</body>
</html>
